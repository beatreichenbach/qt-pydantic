[project]
name = "qt-pydantic"
version = "0.1.2"
description = "Pydantic BaseModel Annotations for Qt"
authors = [
    { name = "Beat Reichenbach" }
]
dependencies = [
    "qtpy>=2.0,<3",
    "pydantic>=2.0,<3",
]
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "python-semantic-release>=9.0",
    "pytest>=8.0",
    "ruff>=0.16",
    "ty>=0.0.82",
    "PySide6",
]
pyside2 = ["PySide2"]
pyside6 = ["PySide6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qt_pydantic*"]

[tool.setuptools.package-data]
qt_pydantic = ["py.typed"]

[tool.semantic_release]
allow_zero_version = true
version_variables = ["qt_pydantic/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.ruff]
target-version = "py39"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["SIM108"]

[tool.ty.environment]
python-version = "3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_level = "INFO"
